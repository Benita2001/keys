name: solana-devnet-authority-proof

on:
  push:
    branches: [main]
    paths:
      - "programs/keys/**"
      - "Anchor.toml"
      - "Cargo.toml"
      - "package.json"
      - "tests/anchor-authority-proof.cjs"
      - "src/pyth-adapter.mjs"
      - ".github/workflows/solana-devnet-authority-proof.yml"
  workflow_dispatch:

jobs:
  devnet-proof:
    runs-on: ubuntu-24.04
    env:
      DEVNET_PROGRAM_ID: "ABjE6V5q9VbD3CAHDXxvztY5kXQmDXHRcEP1kZ4KSSfk"
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve SBF-compatible dependency lock
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path Cargo.toml
          cargo update --manifest-path Cargo.toml -p anchor-attribute-access-control --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-attribute-account --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-attribute-constant --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-attribute-error --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-attribute-event --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-attribute-program --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-derive-accounts --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-derive-serde --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-derive-space --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p anchor-syn --precise 0.32.1
          cargo update --manifest-path Cargo.toml -p borsh@1.8.1 --precise 1.5.7
          cargo update --manifest-path Cargo.toml -p proc-macro-crate@3.5.0 --precise 3.4.0
          if grep -q 'name = "blake3"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p blake3 --precise 1.8.2; fi
          if grep -q 'name = "constant_time_eq"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p constant_time_eq --precise 0.3.1; fi
          if grep -q 'name = "base64ct"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p base64ct --precise 1.7.3; fi
          INDEXMAP_V2=$(awk '/name = "indexmap"/ {getline; gsub(/[" ]/, "", $3); if ($3 ~ /^2\./) {print $3; exit}}' Cargo.lock)
          if [ -n "$INDEXMAP_V2" ] && [ "$INDEXMAP_V2" != "2.11.4" ]; then
            cargo update --manifest-path Cargo.toml -p "indexmap@$INDEXMAP_V2" --precise 2.11.4
          fi
          if grep -q 'name = "zeroize"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p zeroize --precise 1.8.1; fi
          if grep -q 'name = "zeroize_derive"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p zeroize_derive --precise 1.4.2; fi
          if grep -q 'version = "0.23.10+spec-1.0.0"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p 'toml_edit@0.23.10+spec-1.0.0' --precise 0.23.7; fi
          if grep -q 'name = "toml_parser"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p toml_parser --precise 1.0.4; fi
          if grep -q 'name = "unicode-segmentation"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p unicode-segmentation --precise 1.12.0; fi
          # pyth-lazer-protocol 0.46 allows newer serde_with releases whose time dependency requires Rust >=1.88.
          # Keep the Pyth protocol source version while selecting an SBF-compatible serde/time pair.
          if grep -q 'name = "serde_with"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p serde_with --precise 3.12.0; fi
          # Solana 2.3 cargo-build-sbf currently uses Cargo/Rust 1.84.
          if grep -q 'name = "time"' Cargo.lock; then cargo update --manifest-path Cargo.toml -p time --precise 0.3.45; fi
          sed -i 's/^version = 4$/version = 3/' Cargo.lock
          grep -A2 'name = "indexmap"' Cargo.lock || true


      - name: Install Solana CLI 2.3.0
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 0.32.1
        shell: bash
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 0.32.1
          avm use 0.32.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Install JS proof dependencies
        run: npm install --no-audit --no-fund

      - name: Attempt full devnet authority proof
        shell: bash
        env:
          DEVNET_KEYPAIR_JSON: ${{ secrets.DEVNET_KEYPAIR_JSON }}
          PYTH_PRO_API_KEY: ${{ secrets.PYTH_PRO_API_KEY }}
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          mkdir -p "$HOME/.config/solana"

          if [ -n "$DEVNET_KEYPAIR_JSON" ]; then
            printf '%s' "$DEVNET_KEYPAIR_JSON" > "$HOME/.config/solana/id.json"
            chmod 600 "$HOME/.config/solana/id.json"
            echo "PROOF devnet_wallet_source=repository_secret"
          else
            solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
            echo "PROOF devnet_wallet_source=ephemeral"
          fi

          solana config set --url https://api.devnet.solana.com --keypair "$HOME/.config/solana/id.json"
          echo "PROOF devnet_payer=$(solana address)"

          PROGRAM_ID="$DEVNET_PROGRAM_ID"
          anchor build
          echo "PROOF devnet_build=PASS"
          echo "PROOF devnet_program_id=$PROGRAM_ID"
          grep -Fq "declare_id!(\"$PROGRAM_ID\")" programs/keys/src/lib.rs
          echo "PROOF source_program_id_match=PASS"

          set +e
          PROGRAM_SHOW_BEFORE=$(solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com 2>&1)
          PROGRAM_SHOW_RC=$?
          set -e
          echo "$PROGRAM_SHOW_BEFORE"
          if [ $PROGRAM_SHOW_RC -ne 0 ]; then
            echo "DEVNET_PROOF=FAILED_CANONICAL_PROGRAM_LOOKUP"
            exit $PROGRAM_SHOW_RC
          fi
          UPGRADE_AUTHORITY_BEFORE=$(printf '%s\n' "$PROGRAM_SHOW_BEFORE" | awk -F': ' '/^Authority:/ {print $2; exit}')
          PAYER_ADDRESS=$(solana address)
          echo "PROOF devnet_upgrade_authority_before=$UPGRADE_AUTHORITY_BEFORE"
          if [ "$UPGRADE_AUTHORITY_BEFORE" != "$PAYER_ADDRESS" ]; then
            echo "DEVNET_PROOF=FAILED_UPGRADE_AUTHORITY_MISMATCH"
            exit 1
          fi
          echo "PROOF devnet_upgrade_authority_match=PASS"

          BALANCE=$(solana balance --lamports --url https://api.devnet.solana.com 2>/dev/null | tr -dc '0-9' || true)
          BALANCE=${BALANCE:-0}
          echo "PROOF devnet_balance_before_airdrop_lamports=$BALANCE"

          # Reclaim any orphaned upgrade buffers left by an interrupted devnet
          # deployment before asking a faucet for more test SOL.
          set +e
          BUFFERS_OUT=$(solana program show --buffers --buffer-authority "$HOME/.config/solana/id.json" --url https://api.devnet.solana.com 2>&1)
          BUFFERS_RC=$?
          set -e
          echo "$BUFFERS_OUT"
          echo "PROOF devnet_buffer_scan_rc=$BUFFERS_RC"
          if [ $BUFFERS_RC -eq 0 ]; then
            BUFFER_ADDRESSES=$(printf '%s\n' "$BUFFERS_OUT" | awk 'NR>2 && $1 ~ /^[1-9A-HJ-NP-Za-km-z]{32,44}$/ {print $1}')
            for BUFFER_ADDRESS in $BUFFER_ADDRESSES; do
              set +e
              CLOSE_OUT=$(solana program close "$BUFFER_ADDRESS" --url https://api.devnet.solana.com 2>&1)
              CLOSE_RC=$?
              set -e
              echo "$CLOSE_OUT"
              echo "PROOF devnet_buffer_close address=$BUFFER_ADDRESS rc=$CLOSE_RC"
            done
          fi

          BALANCE=$(solana balance --lamports --url https://api.devnet.solana.com 2>/dev/null | tr -dc '0-9' || true)
          BALANCE=${BALANCE:-0}
          echo "PROOF devnet_balance_after_buffer_reclaim_lamports=$BALANCE"

          # First use the native faucet. It is cheap when available, but can be
          # rate-limited independently of our build.
          if [ "$BALANCE" -lt 2500000000 ]; then
            for AIRDROP_ATTEMPT in 1 2 3; do
              set +e
              AIRDROP_OUT=$(solana airdrop 0.5 --url https://api.devnet.solana.com 2>&1)
              AIRDROP_RC=$?
              set -e
              echo "$AIRDROP_OUT"
              echo "PROOF devnet_airdrop_attempt attempt=$AIRDROP_ATTEMPT amount=0.5 rc=$AIRDROP_RC"

              BALANCE=$(solana balance --lamports --url https://api.devnet.solana.com 2>/dev/null | tr -dc '0-9' || true)
              BALANCE=${BALANCE:-0}
              if [ "$BALANCE" -ge 2500000000 ]; then
                break
              fi
              sleep 15
            done
          fi

          BALANCE=$(solana balance --lamports --url https://api.devnet.solana.com 2>/dev/null | tr -dc '0-9' || true)
          BALANCE=${BALANCE:-0}

          # Solana's documented proof-of-work faucet supports target-lamports.
          # Mine the actual shortfall required by the upgrade rather than a fixed
          # amount that can leave the payer below the deployment target.
          TARGET_BALANCE_LAMPORTS=2500000000
          if [ "$BALANCE" -lt "$TARGET_BALANCE_LAMPORTS" ]; then
            SHORTFALL_LAMPORTS=$((TARGET_BALANCE_LAMPORTS - BALANCE))
            echo "PROOF devnet_pow_faucet=START balance_lamports=$BALANCE shortfall_lamports=$SHORTFALL_LAMPORTS"
            cargo install devnet-pow
            set +e
            POW_OUT=$(devnet-pow mine --target-lamports "$SHORTFALL_LAMPORTS" -ud 2>&1)
            POW_RC=$?
            set -e
            echo "$POW_OUT"
            echo "PROOF devnet_pow_faucet_rc=$POW_RC"
          fi

          BALANCE=$(solana balance --lamports --url https://api.devnet.solana.com 2>/dev/null | tr -dc '0-9' || true)
          BALANCE=${BALANCE:-0}
          echo "PROOF devnet_balance_lamports=$BALANCE"
          if [ "$BALANCE" -lt "$TARGET_BALANCE_LAMPORTS" ]; then
            echo "DEVNET_PROOF=BLOCKED_POW_FUNDING target_lamports=$TARGET_BALANCE_LAMPORTS actual_lamports=$BALANCE"
            exit 1
          fi

          set +e
          DEPLOY_OUT=$(solana program deploy target/deploy/keys.so --program-id "$PROGRAM_ID" --url https://api.devnet.solana.com --keypair "$HOME/.config/solana/id.json" 2>&1)
          DEPLOY_RC=$?
          set -e
          # Solana CLI may print a recovery mnemonic for an intermediate
          # deployment buffer when a deploy is interrupted. Never emit that
          # mnemonic into GitHub Actions logs; only the buffer address is useful.
          printf '%s\n' "$DEPLOY_OUT" | sed -E 's/^([a-z]+[[:space:]]+){11}[a-z]+$/[REDACTED_EPHEMERAL_BUFFER_MNEMONIC]/'

          if [ $DEPLOY_RC -ne 0 ]; then
            FAILED_BUFFER=$(printf '%s\n' "$DEPLOY_OUT" | awk '/^solana program close / {print $4; exit}')
            if [ -n "$FAILED_BUFFER" ]; then
              set +e
              FAILED_BUFFER_CLOSE_OUT=$(solana program close "$FAILED_BUFFER" --url https://api.devnet.solana.com 2>&1)
              FAILED_BUFFER_CLOSE_RC=$?
              set -e
              echo "$FAILED_BUFFER_CLOSE_OUT"
              echo "PROOF failed_deploy_buffer_close address=$FAILED_BUFFER rc=$FAILED_BUFFER_CLOSE_RC"
            fi
            if echo "$DEPLOY_OUT" | grep -Eqi "insufficient|faucet|airdrop|funds|balance"; then
              echo "DEVNET_PROOF=BLOCKED_FUNDING_DURING_DEPLOY"
              exit 1
            fi
            echo "DEVNET_PROOF=FAILED_DEPLOY"
            exit $DEPLOY_RC
          fi

          PROGRAM_SHOW_AFTER=$(solana program show "$PROGRAM_ID" --url https://api.devnet.solana.com)
          echo "$PROGRAM_SHOW_AFTER"
          UPGRADE_AUTHORITY_AFTER=$(printf '%s\n' "$PROGRAM_SHOW_AFTER" | awk -F': ' '/^Authority:/ {print $2; exit}')
          echo "PROOF devnet_upgrade_authority_after=$UPGRADE_AUTHORITY_AFTER"
          if [ "$UPGRADE_AUTHORITY_AFTER" != "$PAYER_ADDRESS" ]; then
            echo "DEVNET_PROOF=FAILED_POST_DEPLOY_AUTHORITY_MISMATCH"
            exit 1
          fi
          echo "PROOF devnet_upgrade_authority_postdeploy_match=PASS"
          echo "PROOF explorer=https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"
          export ANCHOR_PROVIDER_URL=https://api.devnet.solana.com
          export ANCHOR_WALLET="$HOME/.config/solana/id.json"

          npm run test:anchor

          echo "DEVNET_PROOF=PASS"
