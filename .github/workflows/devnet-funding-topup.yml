name: devnet-funding-topup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/devnet-funding-topup.yml"
  workflow_dispatch:

jobs:
  topup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEVNET_PAYER: "FuKsZH234Zcy11rXPHWwiPwyuhLjth7brBVsd5BD5Nzk"
      TARGET_LAMPORTS: "2500000000"
      DEVNET_KEYPAIR_JSON: ${{ secrets.DEVNET_KEYPAIR_JSON }}
    steps:
      - name: Request only the required Devnet shortfall from provider faucet
        shell: bash
        run: |
          set -euo pipefail

          rpc_call() {
            local url="$1"
            local payload="$2"
            curl --silent --show-error --max-time 20               -H "content-type: application/json"               --data "$payload"               "$url"
          }

          balance_payload=$(printf '{"jsonrpc":"2.0","id":1,"method":"getBalance","params":["%s",{"commitment":"confirmed"}]}' "$DEVNET_PAYER")
          before_json=$(rpc_call "https://api.devnet.solana.com" "$balance_payload")
          echo "$before_json"
          before=$(printf '%s' "$before_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result",{}).get("value",0))')
          echo "PROOF topup_balance_before_lamports=$before"

          if [ "$before" -ge "$TARGET_LAMPORTS" ]; then
            echo "DEVNET_TOPUP=NOT_NEEDED"
            exit 0
          fi

          shortfall=$((TARGET_LAMPORTS - before))
          # Ask for a small margin for transaction fees while keeping the
          # provider request bounded to this one upgrade gate.
          request=$((shortfall + 10000000))
          if [ "$request" -gt 1000000000 ]; then
            request=1000000000
          fi
          echo "PROOF topup_requested_lamports=$request"

          airdrop_payload=$(printf '{"jsonrpc":"2.0","id":1,"method":"requestAirdrop","params":["%s",%s,{"commitment":"confirmed"}]}' "$DEVNET_PAYER" "$request")
          provider_accepted=0

          set +e
          provider_json=$(rpc_call "https://docs-demo.solana-devnet.quiknode.pro/" "$airdrop_payload")
          provider_rc=$?
          set -e
          echo "$provider_json"
          echo "PROOF quicknode_provider_faucet_rc=$provider_rc"
          if printf '%s' "$provider_json" | python3 -c 'import json,sys; x=json.load(sys.stdin); raise SystemExit(0 if isinstance(x.get("result"), str) else 1)' ; then
            provider_accepted=1
          else
            set +e
            provider_json=$(rpc_call "https://demo.helius.dev/api/rpc?network=devnet" "$airdrop_payload")
            provider_rc=$?
            set -e
            echo "$provider_json"
            echo "PROOF helius_provider_faucet_rc=$provider_rc"
            if printf '%s' "$provider_json" | python3 -c 'import json,sys; x=json.load(sys.stdin); raise SystemExit(0 if isinstance(x.get("result"), str) else 1)' ; then
              provider_accepted=1
            fi
          fi

          # Only wait for confirmation when a provider actually returned a
          # transaction signature. Explicit 429/method-denied responses move
          # directly to the official PoW fallback.
          if [ "$provider_accepted" -eq 1 ]; then
            for attempt in $(seq 1 12); do
              sleep 5
              after_json=$(rpc_call "https://api.devnet.solana.com" "$balance_payload")
              after=$(printf '%s' "$after_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result",{}).get("value",0))')
              echo "PROOF topup_balance_attempt=$attempt lamports=$after"
              if [ "$after" -ge "$TARGET_LAMPORTS" ]; then
                echo "DEVNET_TOPUP=PASS_PROVIDER"
                exit 0
              fi
            done
          fi

          echo "PROOF provider_faucets_unavailable_trying_pow=1"
          if [ -z "${DEVNET_KEYPAIR_JSON:-}" ]; then
            echo "DEVNET_TOPUP=BLOCKED_MISSING_KEYPAIR_SECRET"
            exit 1
          fi
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$DEVNET_KEYPAIR_JSON" > "$HOME/.config/solana/id.json"
          chmod 600 "$HOME/.config/solana/id.json"
          cargo install devnet-pow

          set +e
          pow_out=$(devnet-pow -k "$HOME/.config/solana/id.json" -u https://api.devnet.solana.com -c confirmed mine -d 3 --reward 0.02 --no-infer -t "$TARGET_LAMPORTS" 2>&1)
          pow_rc=$?
          set -e
          echo "$pow_out"
          echo "PROOF topup_pow_rc=$pow_rc mode=official_no_infer target_lamports=$TARGET_LAMPORTS"

          final_json=$(rpc_call "https://api.devnet.solana.com" "$balance_payload")
          final=$(printf '%s' "$final_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result",{}).get("value",0))')
          echo "PROOF topup_balance_after_pow_lamports=$final"
          if [ "$final" -ge "$TARGET_LAMPORTS" ]; then
            echo "DEVNET_TOPUP=PASS_POW"
            exit 0
          fi

          echo "DEVNET_TOPUP=EXTERNAL_DEVNET_FUNDING_UNAVAILABLE"
          exit 1
