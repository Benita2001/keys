name: cloudflare-hosted-execution-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-hosted-execution-smoke.yml"
  workflow_dispatch:

jobs:
  hosted-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KEYS_API_URL: https://keys-api-stocklana.faadil-casecraft.workers.dev

    steps:
      - uses: actions/checkout@v4

      - name: Verify hosted health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$KEYS_API_URL/" | tee /tmp/health.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
            if (x.ok !== true || x.service !== "keys-backend" || x.contractVersion !== "0.2") {
              console.error(x);
              process.exit(1);
            }
          '
          echo "CLOUDFLARE_HOSTED_HEALTH=PASS"

      - name: Create child demo session
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              -X POST \
              -H "content-type: application/json" \
              --data '{"role":"child","displayName":"Hosted Smoke Child"}' \
              "$KEYS_API_URL/api/v0.2/auth/demo-session" \
              > /tmp/child-session.json

            if node -e '
              const fs = require("fs");
              const x = JSON.parse(fs.readFileSync("/tmp/child-session.json","utf8"));
              process.exit(x.role === "child" && typeof x.token === "string" && x.token.length > 10 ? 0 : 1);
            '; then
              cat /tmp/child-session.json
              break
            fi

            echo "Waiting for the latest Cloudflare deployment (attempt $attempt/24)..."
            sleep 10
          done

          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/child-session.json","utf8"));
            if (x.role !== "child" || !x.token) { console.error(x); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_ENV, "CHILD_TOKEN=" + x.token + "\n");
          '
          echo "CLOUDFLARE_HOSTED_CHILD_SESSION=PASS"

      - name: Create guardian demo session
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "content-type: application/json" \
            --data '{"role":"guardian","displayName":"Hosted Smoke Guardian"}' \
            "$KEYS_API_URL/api/v0.2/auth/demo-session" \
            > /tmp/guardian-session.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/guardian-session.json","utf8"));
            if (x.role !== "guardian" || !x.token) { console.error(x); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_ENV, "GUARDIAN_TOKEN=" + x.token + "\n");
          '
          echo "CLOUDFLARE_HOSTED_GUARDIAN_SESSION=PASS"

      - name: Verify hosted Family state and Pyth history
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "authorization: Bearer $CHILD_TOKEN" \
            "$KEYS_API_URL/api/v0.2/family/state" \
            | tee /tmp/family.json
          curl --fail --silent --show-error \
            "$KEYS_API_URL/api/v0.2/market/quotes?symbols=AAPL,NVDA" \
            | tee /tmp/quotes.json

          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error \
              "$KEYS_API_URL/api/v0.2/market/series?symbol=AAPL&period=1M" \
              > /tmp/history.json
            if node -e '
              const fs = require("fs");
              const x = JSON.parse(fs.readFileSync("/tmp/history.json","utf8"));
              process.exit(x.status === "AVAILABLE" && Array.isArray(x.points) && x.points.length > 1 ? 0 : 1);
            '; then
              cat /tmp/history.json
              break
            fi
            echo "Waiting for deployed Pyth history adapter (attempt $attempt/24)..."
            cat /tmp/history.json
            sleep 10
          done

          node -e '
            const fs = require("fs");
            const family = JSON.parse(fs.readFileSync("/tmp/family.json","utf8"));
            const quotes = JSON.parse(fs.readFileSync("/tmp/quotes.json","utf8"));
            const history = JSON.parse(fs.readFileSync("/tmp/history.json","utf8"));
            const aapl = quotes.quotes && quotes.quotes.find((q) => q.symbol === "AAPL");
            const nvda = quotes.quotes && quotes.quotes.find((q) => q.symbol === "NVDA");
            if (!family.profile || !family.mandate || !family.balances) process.exit(1);
            if (quotes.type !== "V0_2_MARKET_QUOTES" || !aapl || !nvda || nvda.status !== "UNAVAILABLE") process.exit(1);
            if (
              history.type !== "V0_2_MARKET_SERIES" ||
              history.status !== "AVAILABLE" ||
              history.source !== "PYTH_PRO_HISTORY" ||
              !Array.isArray(history.points) ||
              history.points.length < 2 ||
              history.truthBoundary?.fabricatedHistory !== false
            ) process.exit(1);
          '
          echo "CLOUDFLARE_HOSTED_FAMILY_MARKET_HISTORY=PASS"

      - name: Prove hosted multi-asset reservation concurrency
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "content-type: application/json" \
            -H "authorization: Bearer $GUARDIAN_TOKEN" \
            --data '{}' \
            "$KEYS_API_URL/api/v0.2/proofs/concurrency" \
            | tee /tmp/concurrency.json
          node -e '
            const fs = require("fs");
            const x = JSON.parse(fs.readFileSync("/tmp/concurrency.json","utf8"));
            if (
              x.type !== "V0_2_CONCURRENCY_PROOF" ||
              x.status !== "PASS" ||
              x.allowed < 1 ||
              x.refused < 1 ||
              x.stateUnchangedAfterRelease !== true ||
              x.truthBoundary?.provesDurableReservationSerialization !== true ||
              x.truthBoundary?.tslaExecutionClaimed !== false ||
              !Array.isArray(x.assetsAttempted) ||
              !x.assetsAttempted.includes("AAPL") ||
              !x.assetsAttempted.includes("TSLA")
            ) {
              console.error(x);
              process.exit(1);
            }
          '
          echo "CLOUDFLARE_HOSTED_CONCURRENCY=PASS"

      - name: Resolve hosted AAPL runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$KEYS_API_URL/api/v0.2/demo/runtime" | tee /tmp/runtime.json
          node - <<'NODE'
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("/tmp/runtime.json","utf8"));
          if (
            x.mode !== "SERVER_HELD_DEVNET_DEMO" ||
            x.network !== "solana-devnet" ||
            x.asset !== "AAPL" ||
            x.programId !== "ABjE6V5q9VbD3CAHDXxvztY5kXQmDXHRcEP1kZ4KSSfk" ||
            x.assetRule?.pythFeedId !== 922 ||
            x.truthBoundary?.executionAsset !== "DEMO_TOKEN" ||
            x.truthBoundary?.realMinorSecuritiesExecution !== false
          ) {
            console.error(x);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `MANDATE_NONCE=${x.mandate.nonce}\n`);
          console.log(`HOSTED_RUNTIME mandate=${x.mandateAddress} version=${x.mandate.version} nonce=${x.mandate.nonce} feed=${x.assetRule.pythFeedId}`);
          NODE
          echo "CLOUDFLARE_HOSTED_RUNTIME=PASS"

      - name: Execute hosted AAPL action
        shell: bash
        run: |
          set -euo pipefail
          IDEMPOTENCY_KEY="cloudflare-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/request.json <<JSON
          {
            "asset": "AAPL",
            "type": "BUY",
            "notional": 5,
            "expectedNonce": ${MANDATE_NONCE},
            "idempotencyKey": "${IDEMPOTENCY_KEY}"
          }
          JSON

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "content-type: application/json" \
            -H "authorization: Bearer $CHILD_TOKEN" \
            -H "idempotency-key: ${IDEMPOTENCY_KEY}" \
            --data-binary @/tmp/request.json \
            "$KEYS_API_URL/api/v0.2/actions/execute" \
            | tee /tmp/execute.json

          node - <<'NODE'
          const fs = require("fs");
          const x = JSON.parse(fs.readFileSync("/tmp/execute.json","utf8"));
          if (
            x.evaluation?.decision !== "ALLOW" ||
            x.evaluation?.reasonCode !== "WITHIN_MANDATE" ||
            x.executionProof?.status !== "CONFIRMED" ||
            x.executionProof?.simulated !== false ||
            !x.executionProof?.signature ||
            x.executionProof?.network !== "solana-devnet" ||
            x.executionProof?.executionAsset !== "DEMO_TOKEN" ||
            x.executionProof?.pyth?.feedId !== 922 ||
            x.executionProof?.pyth?.verification !== "ONCHAIN_PYTH_LAZER" ||
            x.executionProof?.pyth?.authorityEffect !== "NONE"
          ) {
            console.error(x);
            process.exit(1);
          }
          console.log(`HOSTED_SIGNATURE=${x.executionProof.signature}`);
          console.log(`HOSTED_EXPLORER=https://explorer.solana.com/tx/${x.executionProof.signature}?cluster=devnet`);
          NODE

          echo "CLOUDFLARE_HOSTED_HTTP_TO_SOLANA=PASS"
