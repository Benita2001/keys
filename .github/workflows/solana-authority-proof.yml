name: solana-authority-proof

on:
  push:
    branches: [main]
    paths:
      - "programs/keys/**"
      - "Anchor.toml"
      - "package.json"
      - "tests/anchor-authority-proof.cjs"
      - ".github/workflows/solana-authority-proof.yml"
  workflow_dispatch:

jobs:
  runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve SBF-compatible dependency lock
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path programs/keys/Cargo.toml
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-access-control --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-account --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-constant --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-error --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-event --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-attribute-program --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-derive-accounts --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-derive-serde --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-derive-space --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p anchor-syn --precise 0.32.1
          cargo update --manifest-path programs/keys/Cargo.toml -p borsh@1.8.1 --precise 1.5.7
          cargo update --manifest-path programs/keys/Cargo.toml -p proc-macro-crate@3.5.0 --precise 3.4.0
          if grep -q 'name = "blake3"' programs/keys/Cargo.lock; then cargo update --manifest-path programs/keys/Cargo.toml -p blake3 --precise 1.8.2; fi
          if grep -q 'name = "constant_time_eq"' programs/keys/Cargo.lock; then cargo update --manifest-path programs/keys/Cargo.toml -p constant_time_eq --precise 0.3.1; fi
          if grep -q 'name = "base64ct"' programs/keys/Cargo.lock; then cargo update --manifest-path programs/keys/Cargo.toml -p base64ct --precise 1.7.3; fi
          if grep -q 'name = "indexmap"' programs/keys/Cargo.lock; then cargo update --manifest-path programs/keys/Cargo.toml -p indexmap --precise 2.11.4; fi
          sed -i 's/^version = 4$/version = 3/' programs/keys/Cargo.lock
          grep -A2 'name = "blake3"' programs/keys/Cargo.lock
          grep -A2 'name = "indexmap"' programs/keys/Cargo.lock


      - name: Install Solana CLI 2.3.0
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Anchor CLI 0.32.1
        shell: bash
        run: |
          cargo install --git https://github.com/otter-sec/anchor avm --force
          avm install 0.32.1
          avm use 0.32.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          solana --version
          anchor --version
          rustc --version
          node --version

      - name: Create local validator wallet
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"

      - name: Install JS proof dependencies
        run: npm install --no-audit --no-fund

      - name: Build, sync ephemeral local program id, rebuild
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          anchor build
          anchor keys sync
          anchor build
          echo "PROOF runtime_program_id=$(solana address -k target/deploy/keys-keypair.json)"

      - name: Execute authority proof on local Solana validator
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          anchor test --skip-build
