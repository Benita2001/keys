name: pyth-live-proof

on:
  push:
    branches: [main]
    paths:
      - "src/pyth-adapter.mjs"
      - "src/engine.mjs"
      - "scripts/pyth-live-proof.mjs"
      - "test/pyth-adapter.test.mjs"
      - ".github/workflows/pyth-live-proof.yml"
  workflow_dispatch:

jobs:
  pyth-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run deterministic adapter tests
        run: node --test test/pyth-adapter.test.mjs

      - name: Attempt live Pyth Pro proof
        env:
          PYTH_PRO_API_KEY: ${{ secrets.PYTH_PRO_API_KEY }}
        run: node scripts/pyth-live-proof.mjs
